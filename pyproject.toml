[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taint-tracked-env-scrubber"
version = "0.1.0"
description = "Dynamic information flow taint tracker redacting sensitive environment variables and credentials from agent bash execution shells"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
taint-tracked-env-scrubber = "taint_tracked_env_scrubber.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taint_tracked_env_scrubber*"]
